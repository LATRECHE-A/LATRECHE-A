name: profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#1793d1&color_dots=#ebedf0,#bfdcf0,#7cb3dc,#2f6ea6,#123c63
            dist/snake-dark.svg?color_snake=#1793d1&color_dots=#161b22,#0c2a44,#11436b,#19639a,#7fd3ff

      - name: Stats
        run: python3 scripts/stats.py dist/stats.svg
        env:
          # optional secret, a token that can read private repos makes them count too
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: update stats and snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
